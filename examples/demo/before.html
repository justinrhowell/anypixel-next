<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Invite a teammate</title>
<style>body{margin:0;background:#f5f4ee;color:#172923;font:18px/1.5 system-ui}main{max-width:640px;margin:8vh auto;padding:32px}h1{font-size:40px;line-height:1.1}form{padding:28px;background:white;border:1px solid #a8b5af;border-radius:12px}input,button{font:inherit;padding:12px;border:1px solid #65766d;border-radius:6px}input{width:90%;margin:12px 0}button{background:#174e36;color:white;min-width:140px}small{display:block;margin-top:20px}nav{padding:20px 32px;border-bottom:1px solid #a8b5af}a{color:#174e36}</style>
<nav aria-label="Main"><a href="#main">Workspace</a></nav><main id="main"><p>TEAM SETTINGS</p><h1>Invite a teammate</h1><p>Send an invitation to someone you work with.</p><form><input id="email" type="email" required><button type="submit"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><p id="status" role="status"></p></form><small>Your teammate will receive a link to join this workspace.</small></main><script>document.querySelector('form').addEventListener('submit', e => {e.preventDefault();document.querySelector('#status').textContent='Demo: invitation could not be sent. Please try again.';});</script></html>
